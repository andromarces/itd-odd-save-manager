name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      # Cache only the content-addressable files and index. The global virtual
      # store (`links`) holds symlinks that Git's MSYS tar restores as links
      # that native pnpm cannot read (Access is denied).
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}/files
            ${{ steps.pnpm-store.outputs.path }}/index.db
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify global virtual store
        run: pnpm config get virtualStoreType

      - name: Build Frontend
        run: pnpm run build

      - name: Read Rust toolchain
        id: rust-toolchain
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "rust-toolchain.toml"
          $content = Get-Content -Raw -Path $path
          if ($content -match 'channel\s*=\s*"([^"]+)"') {
            "toolchain=$($matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          } else {
            throw "Rust toolchain channel not found in rust-toolchain.toml"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          components: rustfmt, clippy

      - name: Build Tauri App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run tauri build

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $version = "${{ github.ref_name }}" -replace 'v',''

          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "artifacts/$($installer.Name)"
          }

          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName -Destination "artifacts/$($msi.Name)"
          }

          $exe = "src-tauri/target/release/ITD ODD Save Manager.exe"
          if (Test-Path $exe) {
            $zipName = "ITD-ODD-Save-Manager_${version}_portable_x64.zip"
            Compress-Archive -Path $exe -DestinationPath "artifacts/$zipName"
          }

          # Normalize filenames: Replace spaces with hyphens
          Get-ChildItem -Path artifacts -File | ForEach-Object {
            if ($_.Name -like "* *") {
              $newName = $_.Name -replace " ", "-"
              Rename-Item $_.FullName -NewName $newName
            }
          }

          # Validate artifact naming conventions
          $invalidFiles = Get-ChildItem -Path artifacts -File | Where-Object { $_.Name -match ' ' }
          if ($invalidFiles) {
            Write-Error "Invalid artifact names detected (spaces found):"
            $invalidFiles | ForEach-Object { Write-Error " - $($_.Name)" }
            exit 1
          }

          Set-Location artifacts
          $files = Get-ChildItem *
          foreach ($file in $files) {
            $hash = Get-FileHash $file.Name -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)" | Out-File -FilePath SHA256SUMS.txt -Append -Encoding ascii
          }

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          draft: true
          prerelease: false
          body_path: CHANGELOG.md
