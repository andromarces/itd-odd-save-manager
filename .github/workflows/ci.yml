name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: rust-tests (${{ matrix.platform }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-2022]

    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v7

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Read Rust toolchain
        id: rust-toolchain
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "rust-toolchain.toml"
          $content = Get-Content -Raw -Path $path
          if ($content -match 'channel\s*=\s*"([^"]+)"') {
            "toolchain=$($matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          } else {
            throw "Rust toolchain channel not found in rust-toolchain.toml"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings -W clippy::allow_attributes -W clippy::allow_attributes_without_reason

      - name: Run cargo tests
        run: cargo test --locked --all --verbose

  frontend-build:
    name: frontend-build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      # The pnpm/action-setup bootstrap runs `npm ci`. Caching npm's download
      # cache skips the bootstrap download.
      - name: Cache npm download cache
        uses: actions/cache@v6
        with:
          path: C:/npm/cache
          key: npm-cache-${{ runner.os }}-pnpm-action-setup-v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      # Cache only the content-addressable files and index. The global virtual
      # store (`links`) holds symlinks that Git's MSYS tar restores as links
      # that native pnpm cannot read (Access is denied).
      - name: Get pnpm store path
        id: pnpm-store
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $storePath = (pnpm store path --silent | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "pnpm store path failed with exit code $LASTEXITCODE" }
          if (-not $storePath) { throw "pnpm store path printed an empty path" }
          "path=$storePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}/files
            ${{ steps.pnpm-store.outputs.path }}/index.db
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify pnpm version
        run: pnpm --version
      - name: Verify global virtual store
        run: pnpm config get virtualStoreType
      - name: Check oxfmt formatting
        run: pnpm run format:oxfmt:check
      - name: Lint frontend
        run: pnpm run lint
      - name: Run frontend tests
        run: pnpm run test:run
      - name: Build frontend
        run: pnpm run build

  ci-success:
    name: ci-success
    needs: [rust-tests, frontend-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
