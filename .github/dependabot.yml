version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"

  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      vite-plus:
        patterns:
          - vite-plus
          - vite
          - "@voidzero-dev/vite-plus-*"
          - vitest
          - "@vitest/*"
          - oxlint
      ox-tooling:
        patterns:
          - oxfmt
    open-pull-requests-limit: 10
    rebase-strategy: auto

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "daily"
    groups:
      tauri-rust:
        patterns:
          - "tauri"
          - "tauri-*"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
